<!DOCTYPE html>
<html>
<head>
    <title>Subtraction Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .container {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid #3bc4ee;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        h3 {
            color: blue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Subtraction Calculator</h2>

    <input type="number" id="num1" placeholder="Enter First Number">

    <input type="number" id="num2" placeholder="Enter Second Number">

    <input type="number" id="num3" placeholder="Enter Third Number">

    <button onclick="addNumbers()">Subtract</button>

    <h3 id="result"></h3>
</div>

<script>
function addNumbers() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let num3 = Number(document.getElementById("num3").value);

    let sum = num1 - num2 - num3;

    document.getElementById("result").innerHTML =
        "Result: " + sum;
}
</script>

</body>
</html>
